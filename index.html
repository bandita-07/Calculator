<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=VT323&family=Gaegu:wght@700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator-wrapper">
    
    <!-- Cute Kitten Mascot -->
    <div class="cat-mascot" id="mascot">
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <!-- Left Ear -->
        <polygon points="26,45 15,18 42,32" fill="#ffffff" stroke="#f7a8be" stroke-width="3.5" stroke-linejoin="round"/>
        <polygon points="28,42 21,25 38,34" fill="#ffb4c8"/>
        <!-- Right Ear -->
        <polygon points="74,45 85,18 58,32" fill="#ffffff" stroke="#f7a8be" stroke-width="3.5" stroke-linejoin="round"/>
        <polygon points="72,42 79,25 62,34" fill="#ffb4c8"/>
        <!-- Head -->
        <ellipse cx="50" cy="55" rx="36" ry="32" fill="#ffffff" stroke="#f7a8be" stroke-width="3.5"/>
        <!-- Bow -->
        <g transform="translate(18, 26) rotate(-22)">
          <path d="M0,0 C-7,-10 -15,0 0,6 C15,0 7,-10 0,0 Z" fill="#ff6b93"/>
          <circle cx="0" cy="3" r="3.5" fill="#ff386e"/>
        </g>
        <!-- Cheeks -->
        <circle cx="28" cy="62" r="5.5" fill="#ff9cb5" opacity="0.6"/>
        <circle cx="72" cy="62" r="5.5" fill="#ff9cb5" opacity="0.6"/>
        <!-- Eyes -->
        <ellipse cx="37" cy="54" rx="3.2" ry="4" fill="#542e38"/>
        <ellipse cx="63" cy="54" rx="3.2" ry="4" fill="#542e38"/>
        <circle cx="36" cy="52.5" r="1.2" fill="#ffffff"/>
        <circle cx="62" cy="52.5" r="1.2" fill="#ffffff"/>
        <!-- Mouth -->
        <path d="M45,61 Q50,65 50,61 Q50,65 55,61" fill="none" stroke="#542e38" stroke-width="2.2" stroke-linecap="round"/>
        <!-- Paws -->
        <ellipse cx="36" cy="85" rx="7" ry="5.5" fill="#ffffff" stroke="#f7a8be" stroke-width="2.5"/>
        <ellipse cx="64" cy="85" rx="7" ry="5.5" fill="#ffffff" stroke="#f7a8be" stroke-width="2.5"/>
      </svg>
    </div>

    <div class="decor-hearts">💖 ✨</div>

    <!-- Calculator Device -->
    <div class="calculator">
      
      <!-- LCD Screen -->
      <div class="screen-container">
        <div class="screen-prev" id="prevDisplay">&nbsp;</div>
        <div class="screen-curr" id="currDisplay">0</div>
      </div>

      <!-- Keypad (Exact layout from image) -->
      <div class="keypad">
        <!-- Row 1 -->
        <button type="button" class="btn btn-func" id="btnAC">AC</button>
        <button type="button" class="btn btn-func" id="btnPercent">%</button>
        <button type="button" class="btn btn-func" id="btnDel" title="Delete">
          <svg class="backspace-icon" viewBox="0 0 24 24" width="22" height="22">
            <path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z" fill="currentColor"/>
          </svg>
        </button>
        <button type="button" class="btn btn-op" data-op="÷">÷</button>

        <!-- Row 2 -->
        <button type="button" class="btn btn-num" data-num="7">7</button>
        <button type="button" class="btn btn-num" data-num="8">8</button>
        <button type="button" class="btn btn-num" data-num="9">9</button>
        <button type="button" class="btn btn-op" data-op="×">×</button>

        <!-- Row 3 -->
        <button type="button" class="btn btn-num" data-num="4">4</button>
        <button type="button" class="btn btn-num" data-num="5">5</button>
        <button type="button" class="btn btn-num" data-num="6">6</button>
        <button type="button" class="btn btn-op" data-op="-">−</button>

        <!-- Row 4 -->
        <button type="button" class="btn btn-num" data-num="1">1</button>
        <button type="button" class="btn btn-num" data-num="2">2</button>
        <button type="button" class="btn btn-num" data-num="3">3</button>
        <button type="button" class="btn btn-op" data-op="+">+</button>

        <!-- Row 5 -->
        <button type="button" class="btn btn-num" data-num="00">00</button>
        <button type="button" class="btn btn-num" data-num="0">0</button>
        <button type="button" class="btn btn-num" data-num=".">.</button>
        <button type="button" class="btn btn-equals" id="btnEquals">=</button>
      </div>

    </div>

    <!-- Caption from your theme -->
    <div class="footer-slogan">it's basically free! ✨</div>

  </div>

  <script src="script.js"></script>
</body>
</html>
